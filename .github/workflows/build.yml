# This is a basic workflow to help you get started with Actions

name: Update Database

concurrency: 
  group: database-build


# Controls when the action will run. 
on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '15 2 * * *'    

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: install requirements
        run: |
          pip install --upgrade zope.interface
          pip install -r requirements.txt

      # Runs a single command using the runners shell
      - name: build database
        run: make

      - name: setup public directory
        run: |
          mkdir public
          zip f7.db.zip f7.db
          zip f7.csv.zip f7.csv
          mv *.zip public
      - name: Github Pages Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           publish_dir: ./public
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Update db in fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}      
        run: |
          curl -I https://warehouse.fly.dev/
          gzip f7.db
          flyctl ssh sftp put f7.db.gz /dbs/f7.db.gz -a warehouse
          flyctl ssh console -C 'flock /tmp/inspect.lock -c "cd /dbs && gunzip -f /dbs/f7.db.gz && datasette inspect /dbs/*.db --inspect-file /dbs/inspect-data.json"' -a warehouse
          flyctl apps restart warehouse
